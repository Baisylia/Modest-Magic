plugins {
    id 'multiloader-common'
    id 'me.modmuss50.mod-publish-plugin'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

publishMods {
    changelog = rootProject.file("CHANGELOG-LATEST.md").text
    type = STABLE
    version = "${project.version}-${minecraft_version}-${project.name}"
    displayName = "${mod_name} ${project.name.capitalize()} ${minecraft_version} - ${project.version}"
    modLoaders.add(project.name)

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "534359"
        minecraftVersions.add("26.1")
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("${minecraft_version}")
        minecraftVersions.add("26.2")
        client = true
        server = true

        optional("cloth-config")
        optional("rrv")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "sWRvoDiO"
        minecraftVersions.add("26.1")
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("${minecraft_version}")
        minecraftVersions.add("26.2")
        minecraftVersions.add("26.3-snapshot-7")
        minecraftVersions.add("26.3-snapshot-8")

        optional("cloth-config")
        optional("rrv")
    }
}